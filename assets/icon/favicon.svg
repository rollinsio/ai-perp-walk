<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="A tally of four marks struck through in red">
  <!-- Four marks and the fifth struck across them: the running count, and the
       scratch on the cell wall. Geometry is snapped to a 4-unit grid so that at
       16px (64/16 = 4) every bar edge lands exactly on a pixel boundary. -->
  <rect width="64" height="64" fill="#000000"/>
  <g fill="#ffffff">
    <rect x="4"  y="12" width="8" height="40"/>
    <rect x="20" y="12" width="8" height="40"/>
    <rect x="36" y="12" width="8" height="40"/>
    <rect x="52" y="12" width="8" height="40"/>
  </g>
  <path d="M1 45 L63 25" stroke="#ff1f1f" stroke-width="6" fill="none"/>
</svg>
